# Mashed-Potato/.github/workflows/build.yml

name: Automated Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Automated Build Pipeline
      shell: pwsh
      run: ./build.ps1

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: latest-zip
        path: latest.zip