name: Build and Deploy Mashed Potato

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud API Headers
        run: |
          mkdir -p /home/runner/.xlcore/dalamud/Hooks/dev/
          curl -L -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip dalamud.zip -d /home/runner/.xlcore/dalamud/Hooks/dev/

      - name: Run Build Script
        run: ./build.ps1
        shell: pwsh

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f latest.zip repo.json MashedPotato/MashedPotato.json MashedPotato/MashedPotato.csproj
          git commit -m "chore: automated build and version bump [skip ci]" || echo "No changes to commit"
          git push